name: Release

# - Tag v*:            publish a versioned release.
# - Push to main:      refresh the rolling "latest-build" prerelease.
# - Manual run:        build and test; on main it also refreshes "latest-build".
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Runs on the same ref queue up instead of racing to update the same release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/lowtide.exe dist/
          cd dist
          sha256sum lowtide.exe > lowtide.exe.sha256
          cat lowtide.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: lowtide
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/lowtide.exe dist/lowtide.exe.sha256 \
            --title "Lowtide $GITHUB_REF_NAME" \
            --generate-notes

      - name: Update latest-build prerelease
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-build
        run: |
          # Move the tag to this commit. Pushes made with GITHUB_TOKEN do not
          # trigger workflows, and the tag doesn't match v* anyway.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          notes="Automatic build of $GITHUB_SHA from \`main\`, made $(date -u '+%Y-%m-%d %H:%M UTC').

          This is a development build and is replaced on every push to \`main\`. For stable versions, see the other releases."

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Latest build" --notes "$notes" --prerelease
            gh release upload "$TAG" dist/lowtide.exe dist/lowtide.exe.sha256 --clobber
          else
            gh release create "$TAG" dist/lowtide.exe dist/lowtide.exe.sha256 \
              --title "Latest build" --notes "$notes" --prerelease --verify-tag
          fi
