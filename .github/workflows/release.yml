name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and test, and upload the exe as a workflow artifact
  # without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/lowtide.exe dist/
          cd dist
          sha256sum lowtide.exe > lowtide.exe.sha256
          cat lowtide.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: lowtide
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/lowtide.exe dist/lowtide.exe.sha256 \
            --title "Lowtide $GITHUB_REF_NAME" \
            --generate-notes
